name: Publish Tae Takemi v1.2

on:
  push:
    paths:
      - ".github/workflows/publish-tae-takemi-v1.2.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: fbdae28853ff1b00d2aee5b12d8c6f0c82a4f456
          persist-credentials: false

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          pkg="Codex-Dream-Skin-P5R-Tae-Takemi-ethy-v1.2"
          mkdir -p "$pkg/macos" "$pkg/p5r-tae-takemi-ethy-theme"

          cp .gitignore "$pkg/"
          cp apply-takemi-runtime.ps1 "$pkg/"
          cp Install-Takemi-Theme.bat "$pkg/"
          cp MAINTENANCE.md "$pkg/"
          cp p5r-tae-takemi-ethy-theme.zip "$pkg/"
          cp README.en.md "$pkg/"
          cp README.md "$pkg/"
          cp takemi-runtime-override.css "$pkg/"

          cp macos/.gitignore "$pkg/macos/"
          cp macos/apply-takemi-runtime-macos.sh "$pkg/macos/"
          cp macos/Install-Takemi-Theme.command "$pkg/macos/"
          cp macos/patch-takemi-runtime.mjs "$pkg/macos/"
          cp macos/renderer-takemi-hooks.js "$pkg/macos/"
          cp macos/restore-takemi-runtime-macos.sh "$pkg/macos/"
          cp macos/test-patch-macos.sh "$pkg/macos/"

          cp p5r-tae-takemi-ethy-theme/background.webp "$pkg/p5r-tae-takemi-ethy-theme/"
          cp p5r-tae-takemi-ethy-theme/theme.css "$pkg/p5r-tae-takemi-ethy-theme/"
          cp p5r-tae-takemi-ethy-theme/theme.json "$pkg/p5r-tae-takemi-ethy-theme/"

          chmod +x "$pkg"/macos/*.sh "$pkg"/macos/*.command

          zip -r "${pkg}.zip" "$pkg" >/dev/null
          sha256sum "${pkg}.zip" > "${pkg}.zip.sha256"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v1.2"
          target="fbdae28853ff1b00d2aee5b12d8c6f0c82a4f456"
          pkg="Codex-Dream-Skin-P5R-Tae-Takemi-ethy-v1.2"

          cat > release-notes.md <<'EOF'
          ## P5R Tae Takemi Theme v1.2

          Final visual polish release for the Tae Takemi / Persona 5 Royal theme.

          ### Highlights
          - Unified P5R styling for tooltips, hover surfaces and profile menus
          - Improved reasoning / thinking readability
          - Terminal styling aligned with the rest of the theme
          - Shared cross-platform runtime CSS for Windows and macOS
          - Reduced duplicated selectors and cleaned maintenance structure
          - Updated Windows and macOS runtime patch logic

          中文：
          - 统一 Tooltip、悬浮层与头像菜单的 P5R 视觉
          - 改善“思考过程 / 已思考”区域可读性
          - 终端页面样式与主题整体统一
          - Windows / macOS 共用统一运行时主题 CSS
          - 减少重复样式与遗留结构，便于后续适配
          - 同步更新 Windows 与 macOS 运行时补丁逻辑
          EOF

          gh release create "$tag" \
            --target "$target" \
            --title "P5R Tae Takemi Theme v1.2" \
            --notes-file release-notes.md \
            "${pkg}.zip" \
            "${pkg}.zip.sha256"
